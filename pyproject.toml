[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bloatbrain-fo4"
version = "0.0.1"
description = "Experimental Fallout 4 Bloatfly controller bridge for Drosophila-inspired neural simulations"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
